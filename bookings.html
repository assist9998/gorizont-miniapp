<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Горизонт — Заявки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap');
  :root {
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
    --accent:#4f8ef7;--accent2:#38d9a9;--danger:#ff6b6b;--warning:#ffd43b;
    --text:#e8eaf0;--text2:#8b90a8;--border:#2d3250;
    --radius:16px;--radius-sm:10px;
  }
  html[data-theme="light"] {
    --bg:#f4f5f9;--surface:#ffffff;--surface2:#eef0f6;
    --text:#1a1d27;--text2:#6b7086;--border:#e2e4ee;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Geologica',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  svg{display:block}

  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px;padding-top:calc(20px + env(safe-area-inset-top));position:sticky;top:0;z-index:100}
  .header-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;margin-bottom:10px}
  .header-title svg{width:19px;height:19px;color:var(--accent);flex-shrink:0}
  .header-title span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

  .tabs{display:flex;gap:8px;margin-bottom:8px}
  .tab-btn{flex:1;padding:9px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .city-toggle{display:flex;gap:8px}
  .city-btn{flex:1;padding:7px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text2);font-family:inherit;font-size:12px;cursor:pointer}
  .city-btn.active{border-color:var(--accent);color:var(--accent)}

  .content{padding:14px 16px}
  .empty{text-align:center;color:var(--text2);font-size:13px;padding:40px 20px}
  .loading{text-align:center;color:var(--text2);font-size:13px;padding:40px 20px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px 3px 8px;border-radius:20px;flex-shrink:0}
  .badge svg{width:12px;height:12px}
  .badge-pending{background:rgba(255,212,59,.16);color:var(--warning)}
  .badge-confirmed{background:rgba(56,217,169,.16);color:var(--accent2)}
  .badge-self{background:rgba(79,142,247,.14);color:var(--accent)}
  .badge-admin{background:var(--surface2);color:var(--text2)}
  .card-meta{font-size:11px;color:var(--text2)}
  .card-row{font-size:13.5px;margin-bottom:6px;display:flex;gap:8px}
  .card-row:last-of-type{margin-bottom:0}
  .card-row .lbl{flex-shrink:0;display:inline-flex;align-items:center;height:19px;color:var(--text2)}
  .card-row .lbl svg{width:15px;height:15px}
  .card-row .val{color:var(--text);word-break:break-word}
  .card-position{font-size:11px;color:var(--text2);font-weight:600}

  .card-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .act-row{display:flex;gap:8px}
  .act-row .act-btn{flex:1}
  .act-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap;text-decoration:none}
  .act-btn svg{width:15px;height:15px;flex-shrink:0}
  .act-btn.confirm{background:var(--accent2);color:#06251c;border-color:var(--accent2)}
  .act-btn.reject{background:transparent;color:var(--danger)}
  .act-btn.wait{background:transparent;color:var(--accent)}
  .act-btn.contact{background:transparent;color:var(--accent)}
  .act-btn.spot{background:var(--accent);color:#fff;border-color:var(--accent)}
  .act-btn.delete{background:transparent;color:var(--danger)}
  .act-btn:disabled{opacity:.5;cursor:default}
  .act-btn:not(:disabled):active{opacity:.7}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:10px 18px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <div class="header-title" id="headerTitle"></div>
  <div class="tabs">
    <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">Актуальные записи</button>
    <button class="tab-btn" id="tabWaitlist" onclick="switchTab('waitlist')">Лист ожидания</button>
  </div>
  <div class="city-toggle" id="cityToggle" style="display:none"></div>
</div>

<div class="content" id="content">
  <div class="loading">Загрузка…</div>
</div>

<div class="toast" id="toast"></div>

<script>
// Тема — общий localStorage-ключ с index.html (тот же origin GitHub Pages),
// чтобы переключатель темы в журнале действовал и здесь.
document.documentElement.setAttribute("data-theme", localStorage.getItem("gorizont_theme") || "dark");

const API_URL = "https://y95h81n2pl7zlyb6hfca50s2.95.179.188.141.sslip.io";
const tg = window.Telegram?.WebApp;

// Инлайн SVG вместо эмодзи (отзыв пользователя, 2026-09-25) — единый набор
// простых line-иконок, currentColor, чтобы подхватывали цвет из CSS каждого
// места использования (бейджи/строки карточки/кнопки).
const ICONS = {
  clipboard: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="10" height="13" rx="1.5"/><rect x="7.5" y="2.5" width="5" height="3" rx="1"/><path d="M7.5 9h5M7.5 12h5"/></svg>`,
  clock: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg>`,
  checkCircle: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M7 10.2l2 2 4-4.4"/></svg>`,
  check: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>`,
  x: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l10 10M15 5L5 15"/></svg>`,
  trash: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6m-6.5 0 .6 9.4A1.5 1.5 0 0 0 7.6 17h4.8a1.5 1.5 0 0 0 1.5-1.6L14.5 6"/></svg>`,
  child: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M7 9.3h.01M13 9.3h.01M7.2 12.3c1 1 4.6 1 5.6 0"/></svg>`,
  user: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="6.5" r="3"/><path d="M4 17c.7-3.4 3-5 6-5s5.3 1.6 6 5"/></svg>`,
  phone: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3h2l1 3.2-1.6 1.4a10 10 0 0 0 4.5 4.5l1.4-1.6 3.2 1V15a1.5 1.5 0 0 1-1.6 1.5A12.5 12.5 0 0 1 4 5.6 1.5 1.5 0 0 1 5.5 3Z"/></svg>`,
  calendar: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/></svg>`,
  building: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V5.5L10 3l6 2.5V17"/><path d="M4 17h12M8 17v-3h4v3M8 8h.01M12 8h.01M8 11h.01M12 11h.01"/></svg>`,
};
document.getElementById("headerTitle").innerHTML = ICONS.clipboard + "<span>Заявки</span>";

function authHeaders(extra) {
  return Object.assign(
    {"ngrok-skip-browser-warning": "true", "X-Telegram-Init-Data": (tg && tg.initData) || ""},
    extra || {}
  );
}
if(tg){ tg.ready(); tg.expand(); if(tg.requestFullscreen) tg.requestFullscreen(); }

async function withRetry(fn, attempts = 3, delayMs = 500) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try { return await fn(); }
    catch (e) { lastErr = e; if (i < attempts - 1) await new Promise(r => setTimeout(r, delayMs)); }
  }
  throw lastErr;
}

function showToast(text, isError) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.style.color = isError ? "var(--danger)" : "var(--text)";
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

let staffInfo = null;
let activeTab = "active";
let activeCity = "Дананг";
const UNSCOPED_ROLES = ["Директор", "director", "developer"];
let pending = new Set();

async function initStaff() {
  const tgId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "";
  if (!tgId) { renderError("Не удалось определить пользователя"); return; }
  try {
    const data = await withRetry(async () => {
      const resp = await fetch(API_URL + "/staff?tg_id=" + tgId, { headers: authHeaders() });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.json();
    });
    if (!data.ok) { renderError("Нет доступа"); return; }
    staffInfo = data.staff;
    if (UNSCOPED_ROLES.includes(staffInfo.role)) {
      document.getElementById("cityToggle").style.display = "flex";
      renderCityToggle();
    } else {
      activeCity = staffInfo.city || "Дананг";
    }
    load();
  } catch (e) {
    console.error(e);
    renderError("Ошибка загрузки");
  }
}

function renderCityToggle() {
  const el = document.getElementById("cityToggle");
  el.innerHTML = ["Дананг", "Нячанг"].map(c =>
    `<button class="city-btn${c === activeCity ? " active" : ""}" onclick="switchCity('${c}')">${c}</button>`
  ).join("");
}

function switchCity(city) {
  activeCity = city;
  renderCityToggle();
  load();
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById("tabActive").classList.toggle("active", tab === "active");
  document.getElementById("tabWaitlist").classList.toggle("active", tab === "waitlist");
  load();
}

function renderError(text) {
  document.getElementById("content").innerHTML = `<div class="empty">${text}</div>`;
}

// Та же функция, что в index.html/parent.html (security review 2026-08-25) —
// держим идентичными.
function esc(s) {
  return (s || "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function load() {
  document.getElementById("content").innerHTML = `<div class="loading">Загрузка…</div>`;
  try {
    if (activeTab === "active") {
      const data = await withRetry(async () => {
        const resp = await fetch(API_URL + "/bookings/active?city=" + encodeURIComponent(activeCity), { headers: authHeaders() });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      });
      if (!data.ok) { renderError("Не удалось загрузить"); return; }
      renderActive(data.bookings || []);
    } else {
      const data = await withRetry(async () => {
        const resp = await fetch(API_URL + "/waitlist?city=" + encodeURIComponent(activeCity), { headers: authHeaders() });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      });
      if (!data.ok) { renderError("Не удалось загрузить"); return; }
      renderWaitlist(data.waitlist || []);
    }
  } catch (e) {
    console.error(e);
    renderError("Ошибка загрузки");
  }
}

const PENDING_STATUSES = new Set(["Заявка отправлена", "Заявка: напомнено админу", "Заявка: контакты отправлены", "new"]);

// Сортировка "заявок" (отзыв пользователя, 2026-09-25): ожидающие — всегда
// сверху, внутри группы — сначала точные даты текущего месяца, потом
// "Ориентировочно: <месяц> <год>" этого же месяца, потом точные даты
// следующего месяца, потом ориентировочно следующего и т.д. Ключ сортировки
// [год, месяц, признак "ориентировочно" (0=точная раньше, 1=примерная позже),
// день] даёт ровно такой порядок при обычном chronological sort.
const MONTHS_RU_MAP = {
  "январь":1,"февраль":2,"март":3,"апрель":4,"май":5,"июнь":6,
  "июль":7,"август":8,"сентябрь":9,"октябрь":10,"ноябрь":11,"декабрь":12,
};
function dateSortKey(dateStr) {
  const s = (dateStr || "").trim();
  const approx = s.match(/^Ориентировочно:\s*(\S+)\s+(\d{4})/i);
  if (approx) {
    const month = MONTHS_RU_MAP[approx[1].toLowerCase()] || 13;
    return [parseInt(approx[2], 10), month, 1, 0];
  }
  const exact = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (exact) {
    return [parseInt(exact[3], 10), parseInt(exact[2], 10), 0, parseInt(exact[1], 10)];
  }
  return [9999, 99, 1, 99];
}
function compareSortKeys(a, b) {
  for (let i = 0; i < a.length; i++) { if (a[i] !== b[i]) return a[i] - b[i]; }
  return 0;
}

function renderActive(bookings) {
  const content = document.getElementById("content");
  if (!bookings.length) { content.innerHTML = `<div class="empty">Заявок нет</div>`; return; }
  const sorted = [...bookings].sort((a, b) => {
    const aWait = PENDING_STATUSES.has(a.status) ? 0 : 1;
    const bWait = PENDING_STATUSES.has(b.status) ? 0 : 1;
    if (aWait !== bWait) return aWait - bWait;
    return compareSortKeys(
      dateSortKey(a.confirmed_date || a.wished_date),
      dateSortKey(b.confirmed_date || b.wished_date),
    );
  });
  content.innerHTML = sorted.map(b => {
    const isPending = PENDING_STATUSES.has(b.status);
    const dateStr = b.confirmed_date || b.wished_date || "—";
    const uname = (b.telegram || "").replace(/^@/, "");
    const lockKey = "b_" + b.row_num;
    return `
      <div class="card">
        <div class="card-top">
          <span class="badge ${isPending ? "badge-pending" : "badge-confirmed"}">${isPending ? ICONS.clock : ICONS.checkCircle}${isPending ? "Ожидает" : "Подтверждено"}</span>
          <span class="card-meta">${esc(b.city)} · ${esc(b.dept)} · ${esc(b.type_label)}</span>
        </div>
        <div class="card-row"><span class="lbl">${ICONS.child}</span><span class="val">${esc(b.child_name) || "—"}, ${esc(b.child_age) || "—"}</span></div>
        <div class="card-row"><span class="lbl">${ICONS.user}</span><span class="val">${esc(b.parent)}${uname ? " @" + esc(uname) : ""}</span></div>
        <div class="card-row"><span class="lbl">${ICONS.phone}</span><span class="val">${esc(b.phone)}</span></div>
        <div class="card-row"><span class="lbl">${ICONS.calendar}</span><span class="val">${esc(dateStr)}</span></div>
        ${isPending ? `
        <div class="card-actions">
          <button class="act-btn confirm" ${pending.has(lockKey) ? "disabled" : ""} onclick="doConfirm('${b.tg_id}', ${b.row_num}, '${lockKey}')">${ICONS.check}Принять</button>
          <div class="act-row">
            <button class="act-btn reject" ${pending.has(lockKey) ? "disabled" : ""} onclick="doReject('${b.tg_id}', ${b.row_num}, '${lockKey}')">${ICONS.x}Отклонить</button>
            <button class="act-btn wait" ${pending.has(lockKey) ? "disabled" : ""} onclick="doWaitlist('${b.tg_id}', ${b.row_num}, '${lockKey}')">${ICONS.clock}В лист ожидания</button>
          </div>
          ${uname
            ? `<a class="act-btn contact" href="https://t.me/${esc(uname)}" target="_blank" rel="noopener">${ICONS.phone}Связаться</a>`
            : `<button class="act-btn contact" ${pending.has(lockKey) ? "disabled" : ""} onclick="doMessageClient('${b.tg_id}', ${b.row_num}, '${lockKey}')">${ICONS.phone}Связаться через бота</button>`}
        </div>` : ""}
      </div>
    `;
  }).join("");
}

function renderWaitlist(entries) {
  const content = document.getElementById("content");
  if (!entries.length) { content.innerHTML = `<div class="empty">Лист ожидания пуст</div>`; return; }
  content.innerHTML = entries.map((e, i) => {
    const lockKey = "w_" + e.id;
    return `
      <div class="card">
        <div class="card-top">
          <span class="card-position">#${i + 1} в очереди</span>
          <span class="badge ${e.source === "self" ? "badge-self" : "badge-admin"}">${e.source === "self" ? "Сам встал" : "Добавил админ"}</span>
        </div>
        <div class="card-row"><span class="lbl">${ICONS.building}</span><span class="val">${esc(e.city)} · ${esc(e.department)}${e.group_name ? " · " + esc(e.group_name) : ""}</span></div>
        <div class="card-row"><span class="lbl">${ICONS.child}</span><span class="val">${esc(e.child_name) || "—"}, ${esc(e.child_age) || "—"}</span></div>
        <div class="card-row"><span class="lbl">${ICONS.user}</span><span class="val">${esc(e.parent_name)}${e.telegram_username ? " @" + esc(e.telegram_username) : ""}</span></div>
        <div class="card-row"><span class="lbl">${ICONS.phone}</span><span class="val">${esc(e.phone)}</span></div>
        <div class="card-actions">
          <button class="act-btn spot" ${pending.has(lockKey) ? "disabled" : ""} onclick="doSpotFree(${e.id}, '${lockKey}')">${ICONS.check}Место свободно</button>
          <button class="act-btn delete" ${pending.has(lockKey) ? "disabled" : ""} onclick="doDeleteWaitlist(${e.id}, '${lockKey}')">${ICONS.trash}Удалить</button>
        </div>
      </div>
    `;
  }).join("");
}

async function doConfirm(tgId, rowNum, lockKey) {
  if (pending.has(lockKey)) return;
  pending.add(lockKey);
  try {
    const resp = await fetch(API_URL + "/bookings/confirm", {
      method: "POST", headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({tg_id: tgId, row_num: rowNum}),
    });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.error || "Ошибка");
    showToast("Заявка подтверждена");
    load();
  } catch (e) {
    showToast(e.message || "Не удалось подтвердить", true);
  } finally {
    pending.delete(lockKey);
  }
}

async function doReject(tgId, rowNum, lockKey) {
  if (!confirm("Отклонить заявку?")) return;
  if (pending.has(lockKey)) return;
  pending.add(lockKey);
  try {
    const resp = await fetch(API_URL + "/bookings/reject", {
      method: "POST", headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({tg_id: tgId, row_num: rowNum}),
    });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.error || "Ошибка");
    showToast("Заявка отклонена");
    load();
  } catch (e) {
    showToast(e.message || "Не удалось отклонить", true);
  } finally {
    pending.delete(lockKey);
  }
}

async function doMessageClient(tgId, rowNum, lockKey) {
  if (pending.has(lockKey)) return;
  pending.add(lockKey);
  try {
    const resp = await fetch(API_URL + "/bookings/message-client", {
      method: "POST", headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({tg_id: tgId, row_num: rowNum}),
    });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.error || "Ошибка");
    showToast("Клиенту отправлено сообщение через бота");
  } catch (e) {
    showToast(e.message || "Не удалось отправить — возможно, клиент заблокировал бота", true);
  } finally {
    pending.delete(lockKey);
  }
}

async function doWaitlist(tgId, rowNum, lockKey) {
  if (pending.has(lockKey)) return;
  pending.add(lockKey);
  try {
    const resp = await fetch(API_URL + "/bookings/waitlist", {
      method: "POST", headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({tg_id: tgId, row_num: rowNum}),
    });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.error || "Ошибка");
    showToast("Предложение отправлено родителю");
  } catch (e) {
    showToast(e.message || "Не удалось отправить", true);
  } finally {
    pending.delete(lockKey);
  }
}

async function doSpotFree(id, lockKey) {
  if (pending.has(lockKey)) return;
  pending.add(lockKey);
  try {
    const resp = await fetch(API_URL + "/waitlist/spot-free", {
      method: "POST", headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify({id}),
    });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.error || "Ошибка");
    showToast("Родителю отправлено сообщение");
  } catch (e) {
    showToast(e.message || "Не удалось отправить", true);
  } finally {
    pending.delete(lockKey);
  }
}

async function doDeleteWaitlist(id, lockKey) {
  if (!confirm("Убрать из листа ожидания?")) return;
  if (pending.has(lockKey)) return;
  pending.add(lockKey);
  try {
    const resp = await fetch(API_URL + "/waitlist/" + id, {
      method: "DELETE", headers: authHeaders(),
    });
    const d = await resp.json();
    if (!d.ok) throw new Error("Ошибка");
    showToast("Удалено");
    load();
  } catch (e) {
    showToast(e.message || "Не удалось удалить", true);
  } finally {
    pending.delete(lockKey);
  }
}

initStaff();
